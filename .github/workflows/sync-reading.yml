name: Sync reading list

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays, 08:00 UTC
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull books from Hardcover
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: node scripts/sync-reading.mjs --write

      - name: Commit changes
        run: |
          if git diff --quiet -- reading.html index.html; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reading.html index.html
          git commit -m "Sync reading list from Hardcover"
          git push
